plugins {
    id 'maven-publish'
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}
def libraryVersion = providers.gradleProperty('publishVersion').getOrElse(libs.versions.libCrash.get())
if (!(libraryVersion ==~ /(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)/)) {
    throw new GradleException('publishVersion must be a release version such as 1.0.0')
}
group = 'com.github.wukuiqing49'
version = providers.environmentVariable('VERSION').getOrElse(libraryVersion)

android {
    publishing { singleVariant('release') }
    namespace "com.wkq.crash"
    compileSdk libs.versions.compileSdk.get().toInteger()
    ndkVersion libs.versions.ndk.get()
    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version libs.versions.cmake.get()
        }
    }
    buildTypes { release { ndk { debugSymbolLevel 'FULL' } } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = "1.8" }
}
dependencies { testImplementation libs.junit }

afterEvaluate {
    publishing.publications {
        release(MavenPublication) {
            from components.release
            artifactId = 'AppCrash'
            pom {
                name = 'lib_crash'
                description = 'Explicit Java/Kotlin and native crash scenarios for Android testing.'
            }
        }
    }
}
